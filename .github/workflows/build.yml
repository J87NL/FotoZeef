name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxcb-randr0 libxcb-render-util0 libfuse2 xvfb

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: bash packaging/linux/build_appimage.sh

      - name: Boot the packaged app
        run: ./dist/FotoZeef/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      # The spec strips Qt down to what the app uses. Offscreen does not touch
      # the xcb plugin, so a real X server is the only way to catch a cut too far.
      - name: Boot it again against a real X server
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" ./dist/FotoZeef/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: xcb

      - name: Report size
        run: |
          echo "### Linux" >> "$GITHUB_STEP_SUMMARY"
          echo "| what | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| unpacked folder | $(du -sh dist/FotoZeef | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AppImage (download) | $(du -h dist/*.AppImage | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-linux-appimage
          path: dist/*.AppImage

  macos:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: bash packaging/macos/build_app.sh
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}

      - name: Boot the packaged app
        run: ./dist/FotoZeef.app/Contents/MacOS/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Compress the bundle
        run: ditto -c -k --keepParent dist/FotoZeef.app dist/FotoZeef-macos.zip

      - name: Report size
        run: |
          echo "### macOS" >> "$GITHUB_STEP_SUMMARY"
          echo "| what | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| .app bundle | $(du -sh dist/FotoZeef.app | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| zip (download) | $(du -h dist/FotoZeef-macos.zip | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-macos
          path: dist/FotoZeef-macos.zip

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: uv run pyinstaller --noconfirm --clean packaging/fotozeef.spec

      - name: Boot the packaged app
        run: .\dist\FotoZeef\FotoZeef.exe --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $iscc packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report size
        shell: pwsh
        run: |
          $folder = (Get-ChildItem dist\FotoZeef -Recurse | Measure-Object Length -Sum).Sum / 1MB
          $setup = (Get-ChildItem packaging\windows\Output\*.exe | Measure-Object Length -Sum).Sum / 1MB
          "### Windows"                                          | Add-Content $env:GITHUB_STEP_SUMMARY
          "| what | size |"                                      | Add-Content $env:GITHUB_STEP_SUMMARY
          "|---|---|"                                            | Add-Content $env:GITHUB_STEP_SUMMARY
          ("| unpacked folder | {0:N0} MB |" -f $folder)         | Add-Content $env:GITHUB_STEP_SUMMARY
          ("| installer (download) | {0:N0} MB |" -f $setup)     | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-windows
          path: |
            packaging/windows/Output/*.exe
            dist/FotoZeef
