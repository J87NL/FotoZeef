name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A pushed v* tag runs the tests on all three systems, builds all three and
# publishes them as a GitHub Release. Run by hand (Actions > Build > Run
# workflow) it only builds, also when run on a tag; the downloads are then
# under the run's artifacts.
permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  version:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and compare it with the tag
        id: read
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

  linux:
    name: AppImage
    needs: version
    runs-on: ubuntu-latest
    # PyInstaller bundles the build machine's own libraries, and those need at least
    # its glibc. Building on the oldest supported Ubuntu keeps the AppImage running
    # there and on everything newer; ubuntu-latest moves on and broke 0.4.0.
    container: ubuntu:22.04
    steps:
      - name: Install build tools and Qt runtime libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git binutils file xvfb xauth \
            libglib2.0-0 libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: bash packaging/linux/build_appimage.sh

      - name: Check it runs on Ubuntu 22.04 and newer (glibc 2.35)
        run: bash packaging/linux/check_glibc.sh dist/FotoZeef 2.35

      - name: Boot the packaged app
        run: ./dist/FotoZeef/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      # The spec strips Qt down to what the app uses. Offscreen does not touch
      # the xcb plugin, so a real X server is the only way to catch a cut too far.
      - name: Boot it again against a real X server
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" ./dist/FotoZeef/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: xcb

      - name: Report size
        run: |
          echo "### Linux" >> "$GITHUB_STEP_SUMMARY"
          echo "| what | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| unpacked folder | $(du -sh dist/FotoZeef | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AppImage (download) | $(du -h dist/*.AppImage | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-linux-appimage
          path: dist/*.AppImage

  linux-newer:
    # 0.4.0 started on the machine that built it and nowhere older. This boots the
    # finished AppImage on newer systems than the build's, with only what a desktop
    # has installed, so a bundle that leans on the build machine shows up here.
    # ubuntu:rolling moves with each release on purpose: a new Ubuntu that breaks
    # the AppImage should stop a release until it is fixed.
    name: AppImage on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:rolling"]
    steps:
      - name: Install what a desktop already has
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates xvfb xauth libglib2.0-0 libegl1 libgl1 libstdc++6 \
            libfontconfig1 libfreetype6 libxkbcommon-x11-0 libdbus-1-3 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - uses: actions/download-artifact@v4
        with:
          name: fotozeef-linux-appimage
          path: appimage

      - name: Unpack it (a container has no FUSE)
        working-directory: appimage
        run: |
          chmod +x FotoZeef-*.AppImage
          ./FotoZeef-*.AppImage --appimage-extract > /dev/null

      - name: Boot it offscreen
        run: appimage/squashfs-root/AppRun --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Boot it on a real X server
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" appimage/squashfs-root/AppRun --selftest
        env:
          QT_QPA_PLATFORM: xcb

  macos:
    name: macOS app bundle
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: bash packaging/macos/build_app.sh
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}

      - name: Boot the packaged app
        run: ./dist/FotoZeef.app/Contents/MacOS/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Compress the bundle
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          ditto -c -k --keepParent dist/FotoZeef.app "dist/FotoZeef-$version-macos.zip"

      - name: Report size
        run: |
          echo "### macOS" >> "$GITHUB_STEP_SUMMARY"
          echo "| what | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| .app bundle | $(du -sh dist/FotoZeef.app | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| zip (download) | $(du -h dist/FotoZeef-*-macos.zip | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-macos
          path: dist/FotoZeef-*-macos.zip

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: uv run pyinstaller --noconfirm --clean packaging/fotozeef.spec

      - name: Boot the packaged app
        run: .\dist\FotoZeef\FotoZeef.exe --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $iscc packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report size
        shell: pwsh
        run: |
          $folder = (Get-ChildItem dist\FotoZeef -Recurse | Measure-Object Length -Sum).Sum / 1MB
          $setup = (Get-ChildItem packaging\windows\Output\*.exe | Measure-Object Length -Sum).Sum / 1MB
          "### Windows"                                          | Add-Content $env:GITHUB_STEP_SUMMARY
          "| what | size |"                                      | Add-Content $env:GITHUB_STEP_SUMMARY
          "|---|---|"                                            | Add-Content $env:GITHUB_STEP_SUMMARY
          ("| unpacked folder | {0:N0} MB |" -f $folder)         | Add-Content $env:GITHUB_STEP_SUMMARY
          ("| installer (download) | {0:N0} MB |" -f $setup)     | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-windows-installer
          path: packaging/windows/Output/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-windows
          path: |
            packaging/windows/Output/*.exe
            dist/FotoZeef

  release:
    name: Publish the release
    needs: [tests, version, linux, linux-newer, macos, windows]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the three downloads; the unpacked Windows folder is not needed here.
      - uses: actions/download-artifact@v4
        with:
          name: fotozeef-linux-appimage
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: fotozeef-macos
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: fotozeef-windows-installer
          path: artifacts/windows

      - name: Create the release with the three downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          files=(
            artifacts/linux/FotoZeef-"$VERSION"-*.AppImage
            artifacts/macos/FotoZeef-"$VERSION"-macos.zip
            artifacts/windows/FotoZeef-"$VERSION"-setup.exe
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing download: $file"
              ls -R artifacts
              exit 1
            fi
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run after a failed upload: the release may be a leftover draft.
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FotoZeef $VERSION" \
              --generate-notes
          fi
