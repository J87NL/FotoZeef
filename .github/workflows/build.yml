name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxcb-randr0 libxcb-render-util0 libfuse2

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: bash packaging/linux/build_appimage.sh

      - name: Boot the packaged app
        run: ./dist/FotoZeef/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-linux-appimage
          path: dist/*.AppImage

  macos:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: bash packaging/macos/build_app.sh
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}

      - name: Boot the packaged app
        run: ./dist/FotoZeef.app/Contents/MacOS/FotoZeef --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Compress the bundle
        run: ditto -c -k --keepParent dist/FotoZeef.app dist/FotoZeef-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-macos
          path: dist/FotoZeef-macos.zip

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12

      - run: uv run pyinstaller --noconfirm --clean packaging/fotozeef.spec

      - name: Boot the packaged app
        run: .\dist\FotoZeef\FotoZeef.exe --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $iscc packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: fotozeef-windows
          path: |
            packaging/windows/Output/*.exe
            dist/FotoZeef
